name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_VERSION
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "1.0.0" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test TimeTracker.Tests/TimeTracker.Tests.csproj -c Release --runtime win-x64

      - name: Publish
        run: dotnet publish TimeTracker.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:PublishReadyToRun=false -o publish

      - name: Zip
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path publish\* -DestinationPath TimeTracker-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Focus ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: TimeTracker-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            First Windows x64 build of Focus.

            Unzip TimeTracker-win-x64.zip and run TimeTracker.exe. No installer is required.
